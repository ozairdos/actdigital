apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-loans-api
  labels:
    app: library-loans-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-loans-api
  template:
    metadata:
      labels:
        app: library-loans-api
    spec:
      containers:
        - name: api
          image: library-loans-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: library-loans-api
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: library-loans-api
                  key: postgres-connection-string
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3